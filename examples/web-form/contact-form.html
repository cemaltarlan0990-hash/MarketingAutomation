<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İletişim formu</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 20px; }
    label { display: block; margin-top: 16px; }
    input:not([type=checkbox]), textarea { box-sizing: border-box; width: 100%; padding: 10px; }
    .honeypot { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    button { margin-top: 20px; padding: 12px 24px; }
  </style>
  <script src="contact-form.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <h1>İletişim</h1>
  <!-- Publish the updated ASPX package before using this address. -->
  <form id="contactForm" data-api-url="https://alttr-marketingautomation-f9dmgackdme4gueu.westeurope-01.azurewebsites.net/WebLead.aspx">
    <label>Ad <input name="firstName" autocomplete="given-name" maxlength="50" required></label>
    <label>Soyad <input name="lastName" autocomplete="family-name" maxlength="50" required></label>
    <label>E-posta <input name="email" type="email" autocomplete="email" maxlength="100" required></label>
    <label>Telefon <input name="phone" type="tel" autocomplete="tel" maxlength="50"></label>
    <label>Firma <input name="company" autocomplete="organization" maxlength="100"></label>
    <label>Mesaj <textarea name="message" maxlength="1500" rows="5"></textarea></label>
    <!-- Replace this example with the approved disclosure and acknowledgement text. -->
    <label><input name="consent" type="checkbox" required> Form aydınlatma metnini okudum ve talebimin işlenmesini onaylıyorum.</label>
    <div class="honeypot" aria-hidden="true">
      <label>Web sitesi <input name="website" tabindex="-1" autocomplete="off" maxlength="200"></label>
    </div>
    <!-- Only the PUBLIC site key goes here. action must match server verification. -->
    <div class="cf-turnstile" data-sitekey="YOUR_PUBLIC_TURNSTILE_SITE_KEY" data-action="web-lead"></div>
    <button type="submit">Gönder</button>
    <p id="contactFormStatus" role="status" aria-live="polite"></p>
  </form>
</body>
</html>
