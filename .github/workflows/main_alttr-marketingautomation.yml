name: Build, test and deploy ASPX
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alttr-marketingautomation-deployment
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: ALTTR-MarketingAutomation
  ASPX_PACKAGE_DIRECTORY: ${{ github.workspace }}/.artifacts/aspx-package
  APP_BASE_URL: https://alttr-marketingautomation-f9dmgackdme4gueu.westeurope-01.azurewebsites.net

jobs:
  build-test-deploy:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build ASPX package
        run: ./scripts/Build-AspxPackage.ps1 -OutputDirectory "${{ env.ASPX_PACKAGE_DIRECTORY }}" -EnableCrmWrites

      - name: Test ASPX package in IIS Express
        run: ./scripts/Test-AspxPackage.ps1 -PackageRoot "${{ env.ASPX_PACKAGE_DIRECTORY }}/wwwroot"

      - name: Test web form validation and CRM mapping
        run: ./scripts/Test-WebLeadModel.ps1 -PackageRoot "${{ env.ASPX_PACKAGE_DIRECTORY }}/wwwroot"

      - name: Test frontend submission
        run: node --test tests/web-form.test.cjs tests/altium-event-form.test.cjs

      - name: Stamp deployment version
        run: |
          Set-Content -LiteralPath "$env:ASPX_PACKAGE_DIRECTORY/wwwroot/deployment-version.txt" -Value $env:GITHUB_SHA -Encoding utf8

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.ASPX_PACKAGE_DIRECTORY }}/wwwroot
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3A3106BB13374E41A1500F82068A4FFF }}

      - name: Verify deployed ASPX
        run: ./scripts/Test-AspxDeployment.ps1 -BaseUrl "$env:APP_BASE_URL" -ExpectedCommit "$env:GITHUB_SHA"
