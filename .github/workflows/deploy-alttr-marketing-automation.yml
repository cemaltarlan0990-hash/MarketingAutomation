name: Build and deploy ALTTR Marketing Automation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: ALTTR-MarketingAutomation
  API_PROJECT: src/CrmRegistrationGateway.Functions/CrmRegistrationGateway.Api.csproj
  TEST_PROJECT: tests/CrmRegistrationGateway.Functions.Tests/CrmRegistrationGateway.Functions.Tests.csproj
  PUBLISH_DIRECTORY: ${{ github.workspace }}/publish

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Test
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --no-restore --output "${{ env.PUBLISH_DIRECTORY }}"

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIRECTORY }}
